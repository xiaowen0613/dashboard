00", "end": "2026-08-18 17:00:00", "type": "取消", "area": "锦江4区", "rec": "普通回收"}, {"order": "P20260818160146408115", "emp": "汪佳林", "start": "2026-08-18 16:00:00", "end": "2026-08-18 17:00:00", "type": "取消", "area": "高新3区", "rec": "普通回收"}, {"order": "P20260818084240915482", "emp": "岳林涛", "start": "2026-08-18 08:00:00", "end": "2026-08-18 09:00:00", "type": "取消", "area": "南湖3区", "rec": "普通回收"}, {"order": "P20260818084803703820", "emp": "卢得鑫", "start": "2026-08-18 11:00:00", "end": "2026-08-18 12:00:00", "type": "取消", "area": "南湖2区", "rec": "普通回收"}]};
var dates = Object.keys(DATA).sort();

var dateSel = document.getElementById('dateSel');
dateSel.innerHTML = '<option value="__all__">全部日期(整月汇总)</option>' + dates.map(function(d){return '<option value="'+d+'">'+d+'</option>';}).join('');
dateSel.value = '__all__';

function allEmps(date){
  if(date==='__all__'){var s={};dates.forEach(function(d){Object.keys(DATA[d]).forEach(function(n){s[n]=1;});});return Object.keys(s).sort();}
  return Object.keys(DATA[date]).sort();
}
function fillEmps(keep){
  var sel = document.getElementById('empSel');
  var prev = sel.value;
  var date = dateSel.value;
  sel.innerHTML = '<option value="__all__">全部员工</option>' + allEmps(date).map(function(n){return '<option value="'+n+'">'+n+'</option>';}).join('');
  if(keep && allEmps(date).indexOf(prev)>=0) sel.value = prev;
  else sel.value = '__all__';
}
fillEmps(false);

function teamStat(rows){
  var t={task:0,visit:0,deal:0,cancel:0,hold:0};
  rows.forEach(function(e){t.task+=e.task;t.visit+=e.visit;t.deal+=e.deal;t.cancel+=e.cancel;t.hold+=e.hold;});
  t.rateV = t.task>0?(t.visit/t.task*100).toFixed(1):'0';
  t.rateD = t.visit>0?(t.deal/t.visit*100).toFixed(1):'0';
  return t;
}
function fmt(x){return (x||0).toLocaleString();}

var trendChart = null, radarChart = null;
try{
  trendChart = echarts.init(document.getElementById('trendChart'));
  radarChart = echarts.init(document.getElementById('radarChart'));
  window.addEventListener('resize', function(){if(trendChart)trendChart.resize();if(radarChart)radarChart.resize();});
}catch(e){ trendChart=null; radarChart=null; window.__ECHARTS_FAILED__=true; }

function render(){
  var date = dateSel.value;
  var emp = document.getElementById('empSel').value;
  var map = date==='__all__' ? null : DATA[date];
  if(!map && date!=='__all__') return;
  var map2 = map || {};
  if(date==='__all__'){
    map2 = {};
    dates.forEach(function(d){
      Object.keys(DATA[d]).forEach(function(n){
        var e = DATA[d][n];
        if(!map2[n]) map2[n] = {i:e.i, task:0, visit:0, deal:0, cancel:0, hold:0, rateV:0, rateD:0};
        map2[n].task+=e.task; map2[n].visit+=e.visit; map2[n].deal+=e.deal; map2[n].cancel+=e.cancel; map2[n].hold+=e.hold;
      });
    });
    Object.keys(map2).forEach(function(n){
      var e=map2[n];
      e.rateV = e.task>0?Math.round(e.visit/e.task*1000)/10:0;
      e.rateD = e.visit>0?Math.round(e.deal/e.visit*1000)/10:0;
    });
  }
  var names = emp==='__all__' ? allEmps(date) : [emp];
  var rows = names.map(function(n){return map2[n];}).filter(Boolean);
  var t = teamStat(rows);

  document.getElementById('cards').innerHTML = [
    {n:fmt(t.task),l:'有效交付任务量',c:'blue'},
    {n:t.rateV+'%',l:'当日派单上门率',c:parseFloat(t.rateV)>=85?'green':'red',s:parseFloat(t.rateV)>=85?'已达标':'<85%需反馈'},
    {n:t.rateD+'%',l:'上门后成交率',c:parseFloat(t.rateD)>=85?'green':'red',s:parseFloat(t.rateD)>=85?'已达标':'<85%需反馈'},
    {n:fmt(t.cancel)+'单',l:'当日派单取消量',c:t.cancel>0?'orange':'green'},
    {n:fmt(t.hold)+'单',l:'当日派单暂缓量',c:t.hold>0?'orange':'green'},
  ].map(function(c){return '<div class="card '+c.c+'"><div class="n">'+c.n+'</div><div class="l">'+c.l+'</div>'+(c.s?'<div class="s">'+c.s+'</div>':'')+'</div>';}).join('');

  var html = rows.map(function(e, idx){
    var tv = e.rateV<85?'<span class="low">'+e.rateV+'%</span>':'<span class="tag tag-ok">'+e.rateV+'%</span>';
    var td = e.rateD<85?'<span class="low">'+e.rateD+'%</span>':'<span class="tag tag-ok">'+e.rateD+'%</span>';
    return '<tr><td>'+names[idx]+'</td><td>'+e.task+'</td><td>'+e.visit+'</td><td>'+e.deal+'</td><td>'+tv+'</td><td>'+td+'</td><td>'+e.cancel+'</td><td>'+e.hold+'</td></tr>';
  }).join('');
  document.getElementById('tbl').innerHTML = html;

  // 取消/暂缓明细
  var details = [];
  var detailDates = date==='__all__' ? dates : [date];
  detailDates.forEach(function(d){
    (DETAIL[d]||[]).forEach(function(x){
      if(emp!=='__all__' && x.emp!==emp) return;
      details.push(x);
    });
  });
  var cancels = details.filter(function(x){return x.type==='取消';});
  var holds = details.filter(function(x){return x.type==='暂缓';});
  document.getElementById('cancelCnt').textContent = cancels.length;
  document.getElementById('holdCnt').textContent = holds.length;
  document.getElementById('tblDetail').innerHTML = details.map(function(x){
    return '<tr><td>'+x.order+'</td><td>'+x.emp+'</td><td>'+x.start+'</td><td>'+x.end+'</td><td>'+(x.type==='取消'?'<span class="tag tag-bad">取消</span>':'<span class="tag tag-warn">暂缓</span>')+'</td><td>'+x.area+'</td><td>'+x.rec+'</td></tr>';
  }).join('');

  // ECharts 趋势图
  if(trendChart){
    var allT = dates.map(function(d){
      var rows2 = Object.keys(DATA[d]).map(function(n){return DATA[d][n];}).filter(Boolean);
      var st = teamStat(rows2);
      return {d:d, v:parseFloat(st.rateV), dv:parseFloat(st.rateD)};
    });
    trendChart.setOption({
      tooltip:{trigger:'axis',backgroundColor:'rgba(255,255,255,0.96)',borderColor:'#e2e8f0',borderWidth:1,textStyle:{color:'#334155',fontSize:12},axisPointer:{type:'line',lineStyle:{color:'#94a3b8',type:'dashed'}},valueFormatter:function(v){return v+'%';}},
      legend:{data:['上门率','成交率'],top:0,right:10,itemWidth:18,itemHeight:9,textStyle:{fontSize:12,color:'#64748b'}},
      grid:{left:48,right:24,top:38,bottom:32},
      xAxis:{type:'category',data:allT.map(function(x){return x.d.slice(5);}),boundaryGap:false,axisLine:{lineStyle:{color:'#cbd5e1'}},axisLabel:{color:'#64748b',fontSize:11},axisTick:{show:false}},
      yAxis:{type:'value',min:0,max:100,splitLine:{lineStyle:{color:'#eef2f7'}},axisLabel:{color:'#94a3b8',fontSize:10,formatter:'{value}%'}},
      series:[
        {name:'上门率',type:'line',smooth:true,symbol:'circle',symbolSize:7,data:allT.map(function(x){return x.v;}),
         lineStyle:{width:3,color:'#3b82f6'},itemStyle:{color:'#3b82f6',borderColor:'#fff',borderWidth:2},
         areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(59,130,246,0.25)'},{offset:1,color:'rgba(59,130,246,0.02)'}])},
         markLine:{silent:true,symbol:'none',data:[{yAxis:85,lineStyle:{color:'#f59e0b',type:'dashed',width:1.5},label:{formatter:'目标85%',color:'#d97706',fontSize:10,position:'end'}}]}},
        {name:'成交率',type:'line',smooth:true,symbol:'circle',symbolSize:7,data:allT.map(function(x){return x.dv;}),
         lineStyle:{width:3,color:'#22c55e'},itemStyle:{color:'#22c55e',borderColor:'#fff',borderWidth:2},
         areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(34,197,94,0.22)'},{offset:1,color:'rgba(34,197,94,0.02)'}])}}
      ]
    }, true);
  }

  // ECharts 雷达图
  if(radarChart){
    var radarVals;
    var radarName;
    if(emp==='__all__'){ radarVals=[+t.rateV,+t.rateD,Math.min(t.cancel,10),Math.min(t.hold,10)]; radarName='团队平均'; }
    else { var e=map2[emp]; radarVals=[e.rateV,e.rateD,Math.min(e.cancel,10),Math.min(e.hold,10)]; radarName=emp; }
    radarChart.setOption({
      tooltip:{backgroundColor:'rgba(255,255,255,0.96)',borderColor:'#e2e8f0',textStyle:{color:'#334155',fontSize:12},formatter:function(p){var names=['上门率','成交率','取消量','暂缓量'];var v=p.value[p.dataIndex];var suf=p.dataIndex>=2?'单':'%';return names[p.dataIndex]+'：'+v+suf;}},
      legend:{bottom:0,textStyle:{fontSize:12,color:'#64748b'}},
      radar:{center:['50%','52%'],radius:'58%',indicator:[{name:'上门率 '+radarVals[0]+'%',max:100},{name:'成交率 '+radarVals[1]+'%',max:100},{name:'取消量 '+radarVals[2]+'单',max:10},{name:'暂缓量 '+radarVals[3]+'单',max:10}],
        splitArea:{areaStyle:{color:['rgba(59,130,246,0.03)','rgba(59,130,246,0.07)']}},
        splitLine:{lineStyle:{color:'#e2e8f0'}},axisLine:{lineStyle:{color:'#e2e8f0'}},
        axisName:{color:'#475569',fontSize:12}},
      series:[{type:'radar',data:[{value:radarVals,name:radarName,areaStyle:{color:'rgba(59,130,246,0.25)'},lineStyle:{color:'#3b82f6',width:2},itemStyle:{color:'#3b82f6'}}]}]
    }, true);
  }
}

dateSel.onchange = function(){fillEmps(false);render();};
document.getElementById('empSel').onchange = render;
render();
</script>
</body></html>
