<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1e293b;padding:20px}
.hd{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:24px;border-radius:12px;margin-bottom:16px}
.hd h1{font-size:22px;margin-bottom:4px}.hd p{font-size:13px;opacity:.7}
.cb{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;align-items:end}
.fld{display:flex;flex-direction:column;gap:2px}
.fld label{font-size:11px;color:#64748b;font-weight:600}
.fld select,.fld input{padding:6px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:#fff;min-width:130px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card .n{font-size:26px;font-weight:700;color:#0f172a}
.card .l{font-size:12px;color:#64748b;margin-top:4px}
.card .s{font-size:11px;color:#94a3b8;margin-top:2px}
.green .n{color:#22c55e}.red .n{color:#ef4444}.orange .n{color:#f59e0b}.blue .n{color:#3b82f6}.purple .n{color:#8b5cf6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.row{grid-template-columns:1fr}}
.pn{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.pn h3{font-size:15px;margin-bottom:12px;color:#0f172a}
.chart{height:300px}
.tw{overflow:auto;max-height:420px;border:1px solid #e2e8f0;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f8fafc;padding:7px 8px;text-align:left;font-weight:600;color:#475569;border-bottom:2px solid #e2e8f0;font-size:11px;white-space:nowrap;cursor:pointer}
td{padding:6px 8px;border-bottom:1px solid #f1f5f9;font-size:12px}
tr:hover td{background:#f8fafc}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600}
.tag-bad{background:#fee2e2;color:#dc2626}.tag-ok{background:#dcfce7;color:#16a34a}
.low{color:#dc2626;font-weight:700}
</style>
</head>

document.getElementById('dateSel').innerHTML = dates.map(function(d){return '<option value="'+d+'">'+d+'</option>';}).join('');
var curDate = dates[dates.length-1];
document.getElementById('dateSel').value = curDate;

function allEmps(date){return Object.keys(DATA[date]).sort();}
function fillEmps(date, keep){
  var sel = document.getElementById('empSel');
  var prev = sel.value;
  sel.innerHTML = '<option value="__all__">全部员工</option>' + allEmps(date).map(function(n){return '<option value="'+n+'">'+n+'</option>';}).join('');
  if(keep && allEmps(date).indexOf(prev)>=0) sel.value = prev;
  else sel.value = '__all__';
}
fillEmps(curDate, false);

var radarChart = echarts.init(document.getElementById('radarChart'));
var trendChart = echarts.init(document.getElementById('trendChart'));
window.addEventListener('resize', function(){radarChart.resize();trendChart.resize();});

function teamStat(rows){
  var t={task:0,visit:0,deal:0,cancel:0,hold:0};
  rows.forEach(function(e){t.task+=e.task;t.visit+=e.visit;t.deal+=e.deal;t.cancel+=e.cancel;t.hold+=e.hold;});
  t.rateV = t.task>0?(t.visit/t.task*100).toFixed(1):'0';
  t.rateD = t.visit>0?(t.deal/t.visit*100).toFixed(1):'0';
  return t;
}
function fmt(x){return (x||0).toLocaleString();}

function render(){
  var date = document.getElementById('dateSel').value;
  var emp = document.getElementById('empSel').value;
  var map = DATA[date];
  if(!map) return;
  var names = emp==='__all__' ? allEmps(date) : [emp];
  var rows = names.map(function(n){return map[n];}).filter(Boolean);
  var t = teamStat(rows);

  document.getElementById('cards').innerHTML = [
    {n:fmt(t.task),l:'有效交付任务量',c:'blue'},
    {n:t.rateV+'%',l:'当日派单上门率',c:t.rateV>=85?'green':'red',s:t.rateV>=85?'已达标':'<85%需反馈'},
    {n:t.rateD+'%',l:'上门后成交率',c:t.rateD>=85?'green':'red',s:t.rateD>=85?'已达标':'<85%需反馈'},
    {n:fmt(t.cancel)+'单',l:'当日派单取消量',c:t.cancel>0?'orange':'green'},
    {n:fmt(t.hold)+'单',l:'当日派单暂缓量',c:t.hold>0?'orange':'green'},
  ].map(function(c){return '<div class="card '+c.c+'"><div class="n">'+c.n+'</div><div class="l">'+c.l+'</div>'+(c.s?'<div class="s">'+c.s+'</div>':'')+'</div>';}).join('');

  // 明细表
  var html = rows.map(function(e, idx){
    var tv = e.rateV<85?'<span class="low">'+e.rateV+'%</span>':'<span class="tag tag-ok">'+e.rateV+'%</span>';
    var td = e.rateD<85?'<span class="low">'+e.rateD+'%</span>':'<span class="tag tag-ok">'+e.rateD+'%</span>';
    return '<tr><td>'+names[rows.indexOf(e)]+'</td><td>'+e.task+'</td><td>'+e.visit+'</td><td>'+e.deal+'</td><td>'+tv+'</td><td>'+td+'</td><td>'+e.cancel+'</td><td>'+e.hold+'</td></tr>';
  }).join('');
  document.getElementById('tbl').innerHTML = html;

  // 雷达图（选中员工或全部平均）
  var radarData = [];
  if(emp==='__all__'){
    radarData.push({value:[+t.rateV,+t.rateD,t.cancel,t.hold], name:'团队平均'});
  } else {
    var e = map[emp];
    radarData.push({value:[e.rateV,e.rateD,e.cancel,e.hold], name:emp});
  }
  radarChart.setOption({
    tooltip:{formatter:function(p){var v=p.value;return p.name+"<br/>上门率："+v[0]+"%<br/>成交率："+v[1]+"%<br/>取消量："+v[2]+"单<br/>暂缓量："+v[3]+"单";}},
    legend:{bottom:0,left:'center',itemWidth:14,itemHeight:8,textStyle:{fontSize:11}},
    radar:{center:['50%','42%'],radius:'62%',indicator:[{name:'上门率',max:100},{name:'成交率',max:100},{name:'取消量',max:10},{name:'暂缓量',max:10}]},
    series:[{type:'radar',data:radarData}]
  }, true);

  // 团队趋势
  var allT = dates.map(function(d){
    var names2 = allEmps(d);
    var rows2 = names2.map(function(n){return DATA[d][n];}).filter(Boolean);
    var st = teamStat(rows2);
    return {d:d, v:parseFloat(st.rateV), dv:parseFloat(st.rateD)};
  });
  trendChart.setOption({
    tooltip:{trigger:'axis'},
    legend:{bottom:0},
    xAxis:{type:'category',data:allT.map(function(x){return x.d.slice(5);})},
    yAxis:{type:'value',max:100},
    series:[
      {name:'上门率%',type:'line',data:allT.map(function(x){return x.v;}),smooth:true,itemStyle:{color:'#3b82f6'}},
      {name:'成交率%',type:'line',data:allT.map(function(x){return x.dv;}),smooth:true,itemStyle:{color:'#22c55e'}}
    ]
  }, true);
}

document.getElementById('dateSel').onchange = function(){fillEmps(this.value, false);render();};
document.getElementById('empSel').onchange = render;
render();
</script>
</body></html>
